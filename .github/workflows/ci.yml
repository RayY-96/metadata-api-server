name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Explicit bash adds -o pipefail, so a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Format, vet, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)" || { echo "gofmt failed to run"; exit 1; }
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race requires cgo (gcc is preinstalled on ubuntu-latest).
      - name: Unit tests with race detector and coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          {
            echo "## Unit test coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
